version: '3.8'

networks:
  dockerize_devlopment_myproject_network:

services:
  dockerize_devlopment_myproject_redis:
    image: "redis:alpine"
    container_name: dockerize_devlopment_myproject_redis
    ports:
      - "6380:6379"
    networks:
      - dockerize_devlopment_myproject_network

  dockerize_devlopment_myproject_postgres:
    image: postgres:14
    container_name: dockerize_devlopment_myproject_postgres
    restart: always
    environment:
      # Primary Postgres admin user used by the container entrypoint.
      - POSTGRES_USER=
      # Password for the admin user above.
      - POSTGRES_PASSWORD=
      # Database name created at startup.
      - DATABASE_NAME=
      # Application database user created by the init script.
      - DATABASE_USER=
      # Password for the application database user.
      - DATABASE_PASSWORD=
    ports: 
      - '5434:5432'
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U postgres"]
      interval: 5s
      timeout: 15s
      retries: 20
    volumes:
      - ./local_dbdata/dev/postgres:/var/lib/postgresql/data
      - ./database/postgres_database/setup_scripts/01-init.sh:/docker-entrypoint-initdb.d/01-init.sh
    networks:
      - dockerize_devlopment_myproject_network
  
  dockerize_devlopment_myproject_pgadmin:
    image: dpage/pgadmin4:latest
    container_name: dockerize_devlopment_myproject_pgadmin
    environment:
      # Email used to log in to pgAdmin.
      PGADMIN_DEFAULT_EMAIL: 
      # Password used to log in to pgAdmin.
      PGADMIN_DEFAULT_PASSWORD: 
    ports:
      - "8087:80"
    depends_on:
      - dockerize_devlopment_myproject_postgres
    networks:
      - dockerize_devlopment_myproject_network

