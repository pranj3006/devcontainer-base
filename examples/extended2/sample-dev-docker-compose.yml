  dockerize_devlopment_myproject_app:
    build:
      context: .
      args:
        # Host user name forwarded into the container.
        USER_NAME: $USER
        # Display name used by Git inside the container.
        USER_DISP_NAME: 
        # Git email used inside the container.
        USER_EMAIL: 
        
      dockerfile: Dockerfile-DevTeam
    container_name: dockerize_devlopment_myproject_app
    environment:
      # Hostname for the Postgres service in this compose network.
      POSTGRES_SERVER: dockerize_devlopment_myproject_postgres
      # Internal Postgres port inside the container network.
      POSTGRES_PORT: 5432
      # Admin Postgres user name.
      POSTGRES_USER: 
      # Admin Postgres password.
      POSTGRES_PASSWORD:       
      # Default admin database name.
      POSTGRES_DATABASE: 
      # Application database user.
      POSTGRES_APP_USERNAME: 
      # Application database password.
      POSTGRES_APP_PASSWORD: 
      # Application database name.
      POSTGRES_APP_DATABASE:             
      # Hostname for the Redis service in this compose network.
      REDIS_SERVER: dockerize_devlopment_myproject_redis
      # Internal Redis port inside the container network.
      REDIS_PORT: 6380

    ports: 
      # App API / service ports exposed to the host.
      - "8091:8091"
      - "8092:8092"
      - "8093:8093"
    volumes:
      # Mount the repository into the container for live editing.
      - .:/app
      # Mount SSH keys if your workflow needs private Git access.
      - $HOME/.ssh:/home/devuser/.ssh      
    networks:
      - dockerize_devlopment_myproject_network